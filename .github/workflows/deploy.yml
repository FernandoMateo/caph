name: Desplegar en el VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONFIGURADO: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Faltan los secretos del VPS
        if: env.CONFIGURADO != 'true'
        run: echo "::warning::Cargá VPS_HOST, VPS_USER, VPS_PORT y VPS_SSH_KEY en Settings → Secrets → Actions (ver README)."
      - name: Actualizar, compilar y reiniciar
        if: env.CONFIGURADO == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: bash /opt/caph/web/deploy/deploy.sh
